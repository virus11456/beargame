<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#dfe9ee"><title>冰原營地 · Polar Camp</title><link rel="stylesheet" href="/style.css"></head><body>
<canvas id="game" aria-label="冰原營地 3D 遊戲"></canvas>
<header><div class="brand"><div class="title">冰原營地<small>POLAR CAMP</small></div></div><div class="top-right"><div class="money" aria-live="polite"><svg class="ic big" aria-hidden="true"><use href="#i-bill"/></svg><b id="coins">0</b></div><button id="restart" aria-label="重新開始遊戲"><svg class="ic" aria-hidden="true"><use href="#i-restart"/></svg></button><button id="pause" aria-label="暫停與設定"><svg class="ic" aria-hidden="true"><use href="#i-pause"/></svg></button></div></header>
<button id="objective" class="objective" aria-label="前往目前目標"><svg class="ic" aria-hidden="true"><use href="#i-navigate"/></svg><span>走向熊群，靠近就會自動揮砍</span></button><div id="labels"></div><div id="toast" role="status"></div><button id="update" class="update" hidden><svg class="ic" aria-hidden="true"><use href="#i-restart"/></svg>有新版本，點一下更新</button>
<div id="stage" class="stage-pill"><div class="stage-text"><b id="stage-name">第 1 關 雪原營地</b><span id="stage-goal">目標 0 / 1200</span></div><i class="stage-track"><i id="stage-bar"></i></i><button id="next-stage" hidden>下一關 <svg class="ic" aria-hidden="true"><use href="#i-arrow"/></svg></button></div>
<div class="bottom"><div class="pill" id="bag"><svg class="ic big" aria-hidden="true"><use href="#i-meat"/></svg><b>0 / 30</b></div><div class="pill subtle" id="stats">擊倒 0 · 售出 0</div><div class="pill subtle auto" id="auto-pill" hidden><svg class="ic" aria-hidden="true"><use href="#i-auto"/></svg><span>自動化 0/4</span></div></div>
<div id="joystick" aria-hidden="true"><div id="stick"></div></div><div class="controls">WASD / 方向鍵移動 · 點地面前往 · 靠近熊自動揮砍</div><div class="touch-hint">拖曳畫面移動 · 點一下前往</div><div id="version" class="version"></div>
<div id="menu" class="overlay"><section class="welcome"><span class="tag">一座營地，從第一塊熊肉開始</span><h1>冰原營地<span>POLAR CAMP</span></h1><p>衝進熊群一刀掃倒一片，背著高高的肉堆回營；客人把錢留在桌邊，撿起來踩上標記就能升級。</p><div class="steps">獵熊 → 搬肉 → 販售 → 收錢 → 升級 → 擴張</div><div class="profile"><label class="name-field">獵人名字<input id="name" maxlength="12" autocomplete="off" placeholder="獵人"></label><div id="records" class="records"></div></div><div id="stages" class="stage-list"></div><button id="start">開始經營 <span><svg class="ic" aria-hidden="true"><use href="#i-arrow"/></svg></span></button><div class="settings"><button id="sound">音效：開</button><button id="quality">畫質：標準</button><button id="reset">重新開始</button></div><small id="save-note">自動儲存於此瀏覽器 · 支援觸控與鍵盤</small></section></div>
<div id="story" class="overlay" hidden><section class="story-card"><small id="story-chapter">第 1 章</small><h2 id="story-title">雪原營地</h2><em id="story-speaker">村長</em><p id="story-text"></p><div class="story-goal" id="story-goal"></div><div class="story-actions"><button id="story-go">出發 <svg class="ic" aria-hidden="true"><use href="#i-arrow"/></svg></button><button id="story-next" hidden>前往下一關 <svg class="ic" aria-hidden="true"><use href="#i-arrow"/></svg></button></div></section></div>
<script type="module" src="/game.js"></script></body></html>
