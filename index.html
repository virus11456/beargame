<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173e4b"><title>冰原營地 · Polar Camp</title><link rel="stylesheet" href="/style.css"></head><body>
<canvas id="game" aria-label="冰原營地 3D 遊戲"></canvas>
<header><div class="brand"><span class="emblem">❄</span><div>冰原營地<small>POLAR CAMP</small></div></div><div class="top-right"><div class="money"><span>●</span> <b id="coins">0</b></div><button id="pause" aria-label="暫停與設定">Ⅱ</button></div></header>
<section class="mission"><div class="eyebrow">營地日誌 <span id="level">01 / 初次開張</span></div><strong id="objective">前往雪地，獵取第一份生肉</strong><button id="navigate">前往北極熊 ↗</button><div class="track"><i id="progress"></i></div></section>
<aside id="shop" hidden><div class="shop-title"><div><small>CAMP UPGRADES</small><h2>讓營地更忙碌</h2></div><button id="close-shop" aria-label="關閉升級">×</button></div><p>每一筆收入，都變成看得見的成長。</p><div id="upgrades"></div></aside>
<div id="context-hint" hidden></div><div id="toast" role="status"></div><div id="labels"></div>
<div class="bottom"><div class="inventory"><span id="bag">背包 0 / 12</span><div id="items">生肉 0　肉排 0　餐點 0</div><div id="stats"></div><div class="health"><i id="health"></i></div></div><button id="open-shop"><span>⌂</span> 擴建營地 <small>升級與助手</small></button></div>
<div id="joystick" aria-label="拖曳移動"><div id="stick"></div></div><div class="controls">WASD / 方向鍵移動 · 靠近自動工作</div>
<div id="menu" class="overlay"><section class="welcome"><span class="tag">一座營地，從第一份烤肉開始</span><h1>冰原營地<span>POLAR CAMP</span></h1><p>走進雪地，帶回滿背的收穫。<br>把熱騰騰的烤肉，變成你的第一桶金。</p><div class="steps">獵熊 → 搬肉 → 加工 → 烹調 → 販售 → 擴建</div><button id="start">開始經營 <span>→</span></button><div class="settings"><button id="sound">音效：開</button><button id="quality">畫質：標準</button><button id="reset">重新開始</button></div><small id="save-note">自動儲存於此瀏覽器 · 支援觸控與鍵盤</small></section></div>
<script type="module" src="/game.js"></script></body></html>
