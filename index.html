<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#dfe9ee"><title>冰原營地 · Polar Camp</title><link rel="stylesheet" href="/style.css"></head><body>
<canvas id="game" aria-label="冰原營地 3D 遊戲"></canvas>
<header><div class="brand"><div class="title">冰原營地<small>POLAR CAMP</small></div><button id="objective" class="objective" aria-label="前往目前目標">走向熊群，靠近就會自動揮砍</button></div><div class="top-right"><div class="money" aria-live="polite"><span class="bill"></span><b id="coins">0</b></div><button id="restart" aria-label="重新開始遊戲">↻</button><button id="pause" aria-label="暫停與設定">Ⅱ</button></div></header>
<div id="labels"></div><div id="toast" role="status"></div>
<div class="bottom"><div class="pill" id="bag"><span class="meat"></span><b>0 / 30</b></div><div class="pill subtle" id="stats">擊倒 0 · 售出 0</div></div>
<div id="joystick" aria-label="拖曳移動"><div id="stick"></div><small>拖曳以移動</small></div><div class="controls">WASD / 方向鍵移動 · 點地面前往 · 靠近熊自動揮砍</div>
<div id="menu" class="overlay"><section class="welcome"><span class="tag">一座營地，從第一塊熊肉開始</span><h1>冰原營地<span>POLAR CAMP</span></h1><p>衝進熊群一刀掃倒一片，背著高高的肉堆回營；<br>客人把錢留在桌邊，撿起來踩上標記就能升級。</p><div class="steps">獵熊 → 搬肉 → 販售 → 收錢 → 升級 → 擴張</div><button id="start">開始經營 <span>→</span></button><div class="settings"><button id="sound">音效：開</button><button id="quality">畫質：標準</button><button id="reset">重新開始</button></div><small id="save-note">自動儲存於此瀏覽器 · 支援觸控與鍵盤</small></section></div>
<script type="module" src="/game.js"></script></body></html>
